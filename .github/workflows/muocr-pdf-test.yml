name: MuOCR PDF integration test

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "ocrtool/**"
      - ".github/workflows/muocr-pdf-test.yml"
  workflow_dispatch:

jobs:
  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Enable emulator KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Multi-batch PDF OCR integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: gradle :ocrtool:connectedDebugAndroidTest --stacktrace

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muocr-pdf-test-report
          path: |
            ocrtool/build/reports/androidTests/connected/**
            ocrtool/build/outputs/androidTest-results/connected/**
          retention-days: 7
          if-no-files-found: ignore
