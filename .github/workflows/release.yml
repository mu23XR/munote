name: Publish or Promote MuNote Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "prepare = build/publish prerelease; promote = convert existing prerelease to stable"
        required: true
        default: "prepare"
        type: choice
        options:
          - prepare
          - promote
      version:
        description: "Version without v, for example 0.3.0"
        required: true
        type: string
      source_ref:
        description: "Source branch/tag/commit used only for prepare"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.action == 'prepare'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Validate version and resolve source
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match MAJOR.MINOR.PATCH; got: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Existing published versions are never overwritten."
            exit 1
          fi
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REF" --jq .sha)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create draft prerelease container
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA"             --title "MuNote $TAG" --generate-notes --draft --prerelease
          printf '%s\n' "$SOURCE_SHA" > SOURCE_COMMIT.txt
          gh release upload "$TAG" SOURCE_COMMIT.txt --repo "$GITHUB_REPOSITORY"

  android:
    if: inputs.action == 'prepare'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore private release signing key
        env:
          KEY_BASE64: ${{ secrets.MUNOTE_SIGNING_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUNOTE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUNOTE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUNOTE_SIGNING_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.MUNOTE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEY_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$EXPECTED_CERT"
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          KEYSTORE="$GITHUB_WORKSPACE/.ci/munote-release.jks"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          ACTUAL=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"             | awk -F': ' '/SHA256:/ { gsub(":","",$2); print toupper($2); exit }')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"
          echo "MUNOTE_SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "MUNOTE_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MUNOTE_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MUNOTE_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "MUNOTE_EXPECTED_CERT=$EXPECTED" >> "$GITHUB_ENV"

      - name: Set version metadata
        run: |
          set -euo pipefail
          CODE=$((GITHUB_RUN_NUMBER + 100000))
          echo "MUNOTE_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "MUNOTE_VERSION_NAME=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify signer and upload directly to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK"             | awk -F': ' '/certificate SHA-256 digest:/ { gsub(":","",$2); print toupper($2); exit }')
          test "$ACTUAL" = "$MUNOTE_EXPECTED_CERT"
          OUT="MuNote-$RELEASE_VERSION.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          gh release upload "$RELEASE_TAG" "$OUT" "$OUT.sha256" --repo "$GITHUB_REPOSITORY"

  publish:
    if: inputs.action == 'prepare'
    needs: [prepare, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

  promote:
    if: inputs.action == 'promote'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote existing prerelease without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match MAJOR.MINOR.PATCH; got: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --draft=false --latest
