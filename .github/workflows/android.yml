name: Android CI

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MUNOTE_VERSION_CODE: ${{ github.run_number }}
      MUNOTE_VERSION_NAME: 0.2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify fixed test signing certificate
        run: |
          keytool -list -v             -keystore app/keystore/munote-test.keystore             -storepass munote-test-only             -alias munote-test | grep "SHA256:" | grep "29:32:58:F5:97:70:E0:FD:5E:75:F6:49:7E:50:6D:9C:95:DF:CF:82:C7:55:DE:66:DD:76:DE:D5:4A:46:7D:63"

      - name: Build fixed-signature test APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify built APK identity and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep "package: name='dev.munote.app.debug'"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/munote-apk-certs.txt
          grep -i "293258f59770e0fd5e75f6497e506d9c95dfcf82c755de66dd76ded54a467d63" /tmp/munote-apk-certs.txt

      - name: Prepare named test APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "MuNote-Test-${MUNOTE_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MuNote-Test-${{ github.run_number }}
          path: MuNote-Test-${{ env.MUNOTE_VERSION_NAME }}.apk
          retention-days: 3
