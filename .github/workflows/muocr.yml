name: MuOCR Android

on:
  push:
    branches:
      - "main"
    paths:
      - "ocrtool/**"
      - "settings.gradle.kts"
      - ".github/workflows/muocr.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ocrtool/**"
      - "settings.gradle.kts"
      - ".github/workflows/muocr.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muocr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test disk-backed PDF incremental writer
        run: gradle :ocrtool:testDebugUnitTest --stacktrace

      - name: Print failed test stack traces
        if: failure()
        run: |
          find ocrtool/build/test-results/testDebugUnitTest -type f -name '*.xml' -print -exec grep -A 45 -B 3 '<failure' {} \; || true

      - name: Build MuOCR APK
        run: gradle :ocrtool:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="ocrtool/build/outputs/apk/release/ocrtool-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" MuOCR-v1.1.3.apk
          sha256sum MuOCR-v1.1.3.apk > MuOCR-v1.1.3.apk.sha256

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: MuOCR-v1.1.3
          path: |
            MuOCR-v1.1.3.apk
            MuOCR-v1.1.3.apk.sha256
          retention-days: 30

      - name: Publish MuOCR stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="muocr-v1.1.3"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Published APKs must never be overwritten."
            exit 1
          fi
          gh release create "$TAG" MuOCR-v1.1.3.apk MuOCR-v1.1.3.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MuOCR v1.1.3 — 队列异常恢复保护" \
            --notes "MuOCR v1.1.3 正式版：多个 PDF 严格串行，单文件独立缓存、暂停、继续、取消及手动重试。新增异常中断隔离：同一 PDF 在 60 分钟内被系统异常终止并重启 3 次后自动标记失败，保留 OCR/PDF 断点并处理下一个文件，避免队列死循环；失败时仅删除不完整输出，不删除 OCR 缓存。升级保持原包名、签名、旧队列 JSON 兼容，可覆盖安装。已通过自动化测试及签名校验，用户真实 1GB 文件完整设备验收仍未完成。" \
            --latest
