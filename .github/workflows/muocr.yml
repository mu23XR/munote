name: MuOCR Android

on:
  push:
    branches:
      - "main"
    paths:
      - "ocrtool/**"
      - "settings.gradle.kts"
      - ".github/workflows/muocr.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ocrtool/**"
      - "settings.gradle.kts"
      - ".github/workflows/muocr.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muocr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test disk-backed PDF incremental writer
        run: gradle :ocrtool:testDebugUnitTest --stacktrace

      - name: Build MuOCR APK
        run: gradle :ocrtool:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="ocrtool/build/outputs/apk/debug/ocrtool-debug.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" MuOCR-0.1.3-test.apk
          sha256sum MuOCR-0.1.3-test.apk > MuOCR-0.1.3-test.apk.sha256

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: MuOCR-Android-0.1.3
          path: |
            MuOCR-0.1.3-test.apk
            MuOCR-0.1.3-test.apk.sha256
          retention-days: 30

      - name: Publish MuOCR test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="muocr-v0.1.3-test"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Published test APKs must never be overwritten."
            exit 1
          fi
          gh release create "$TAG" MuOCR-0.1.3-test.apk MuOCR-0.1.3-test.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MuOCR 0.1.3 test — Chinese font fix" \
            --notes "Fixes OTF glyph-table errors on Xiaomi CJK fonts with a bundled SIL-OFL TrueType fallback and outline checks. Includes Chinese text-layer search regression tests and retains 583-page OCR checkpoints. Real 1GB device verification is pending." \
            --prerelease
