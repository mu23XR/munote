name: MuOCR Android

on:
  push:
    branches:
      - "main"
    paths:
      - "ocrtool/**"
      - "settings.gradle.kts"
      - ".github/workflows/muocr.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ocrtool/**"
      - "settings.gradle.kts"
      - ".github/workflows/muocr.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muocr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test disk-backed PDF incremental writer
        run: gradle :ocrtool:testDebugUnitTest --stacktrace

      - name: Print failed test stack traces
        if: failure()
        run: |
          find ocrtool/build/test-results/testDebugUnitTest -type f -name '*.xml' -print -exec grep -A 45 -B 3 '<failure' {} \; || true

      - name: Build MuOCR APK
        run: gradle :ocrtool:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="ocrtool/build/outputs/apk/release/ocrtool-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" MuOCR-v1.1.0.apk
          sha256sum MuOCR-v1.1.0.apk > MuOCR-v1.1.0.apk.sha256

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: MuOCR-v1.1.0
          path: |
            MuOCR-v1.1.0.apk
            MuOCR-v1.1.0.apk.sha256
          retention-days: 30

      - name: Publish MuOCR stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="muocr-v1.1.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Published APKs must never be overwritten."
            exit 1
          fi
          gh release create "$TAG" MuOCR-v1.1.0.apk MuOCR-v1.1.0.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MuOCR v1.1.0 — 批量任务队列" \
            --notes "MuOCR v1.1.0 正式版：新增 Android 文件多选、一次选定输出文件夹、持久化串行队列、逐任务独立 OCR/导出缓存及暂停/继续/取消/失败重试、队列暂停/继续、重启后恢复未完成项。始终只有一个文件进行 OCR，取消一个不会取消其他排队文件。基于 1.0.0 的可搜索中文 PDF 引擎。保留原应用包名及原签名，可覆盖安装且旧 583 页 OCR 缓存可迁移。已通过自动化回归测试和签名校验，但未经真实 1GB/583 页数据的完整实机验收；请保留原文件并预留至少 4GB 存储空间，不要卸载应用或清除数据。" \
            --latest
