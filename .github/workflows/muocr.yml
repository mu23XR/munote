name: MuOCR Android

on:
  push:
    branches:
      - "main"
    paths:
      - "ocrtool/**"
      - "settings.gradle.kts"
      - ".github/workflows/muocr.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ocrtool/**"
      - "settings.gradle.kts"
      - ".github/workflows/muocr.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muocr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test disk-backed PDF incremental writer
        run: gradle :ocrtool:testDebugUnitTest --stacktrace

      - name: Print failed test stack traces
        if: failure()
        run: |
          find ocrtool/build/test-results/testDebugUnitTest -type f -name '*.xml' -print -exec grep -A 45 -B 3 '<failure' {} \; || true

      - name: Build MuOCR APK
        run: gradle :ocrtool:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="ocrtool/build/outputs/apk/release/ocrtool-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" MuOCR-v1.1.2.apk
          sha256sum MuOCR-v1.1.2.apk > MuOCR-v1.1.2.apk.sha256

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: MuOCR-v1.1.2
          path: |
            MuOCR-v1.1.2.apk
            MuOCR-v1.1.2.apk.sha256
          retention-days: 30

      - name: Publish MuOCR stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="muocr-v1.1.2"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Published APKs must never be overwritten."
            exit 1
          fi
          gh release create "$TAG" MuOCR-v1.1.2.apk MuOCR-v1.1.2.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MuOCR v1.1.2 — 取消任务安全性修复" \
            --notes "MuOCR v1.1.2 正式版：队列切换任务瞬间点击取消时，改用原子提交后的任务状态决定是否清理缓存，防止误删正在处理的 PDF 工作副本。保留批量多选、严格串行、单任务暂停/继续/取消、暂停全部、失败重试、独立输出与断点恢复功能。增加取消与任务认领竞态回归测试。沿用原签名及包名，可以覆盖安装并保留 OCR 缓存。尚未在用户实际 1GB PDF 上完成整本设备端验收。" \
            --latest
